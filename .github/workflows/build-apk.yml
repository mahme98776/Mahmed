name: Build & Release VoiceMaster Pro APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: 🚀 Build, Version & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: 🔑 Ensure Signing Keystore Available
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: 🔢 Calculate Build Version & Number
        id: versioning
        run: |
          VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo "10")
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v2.7.0-build${{ github.run_number }}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Detected Version Code: $VERSION_CODE | Tag: $TAG_NAME"

      - name: 🛠️ Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: 🔐 Sign APK (Keystore / Fallback)
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          OUTPUT_APK="VoiceMasterPro-${{ env.TAG_NAME }}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "🔑 Decoding production Keystore and signing APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -f "$APKSIGNER" ]; then
              $APKSIGNER sign --ks release.keystore --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" --out "$OUTPUT_APK" "$APK_PATH"
              echo "✅ APK successfully signed with production Keystore!"
            else
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" "$APK_PATH" "$KEY_ALIAS"
              cp "$APK_PATH" "$OUTPUT_APK"
            fi
            rm -f release.keystore
          else
            echo "ℹ️ Using built signed APK."
            cp "$APK_PATH" "$OUTPUT_APK"
          fi

          echo "RELEASE_APK=$OUTPUT_APK" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMasterPro-APK
          path: ${{ env.RELEASE_APK }}
          retention-days: 14

      - name: 🌐 Create GitHub Release & Publish APK
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          tag_name: ${{ env.TAG_NAME }}
          name: "VoiceMaster Pro Release ${{ env.TAG_NAME }}"
          body: |
            ## 🎉 فويس ماستر برو | VoiceMaster Pro
            
            ### ✨ تحديث جديد ومستقر (OTA Build)
            - **رقم الإصدار (Version):** `${{ env.TAG_NAME }}`
            - **كود البناء (Build Code):** `${{ env.VERSION_CODE }}`
            - **ملف التثبيت المباشر:** `${{ env.RELEASE_APK }}`
            - **حقوق المطور والناشر:** محمد سليمه (mahme98776@gmail.com)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
