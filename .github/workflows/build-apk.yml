name: Build & Release VoiceMaster Pro APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      auto_increment:
        description: 'Auto-increment version in build.gradle.kts'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: 🚀 Build, Version & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: 🔢 Calculate Build Version & Number
        id: versioning
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.7.0")
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Detected Version Code: $VERSION_CODE | Tag: $TAG_NAME"

      - name: ⚡ Run Gradle Auto-Increment Version Task
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew incrementVersion || true
          else
            gradle incrementVersion || true
          fi

      - name: 🛠️ Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: 🔐 Sign APK (Keystore / Debug fallback)
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          OUTPUT_APK="VoiceMasterPro-${{ env.TAG_NAME }}-build${{ env.VERSION_CODE }}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "🔑 Decoding production Keystore and signing APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            
            # Find apksigner in Android SDK build-tools
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -f "$APKSIGNER" ]; then
              $APKSIGNER sign --ks release.keystore --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" --out "$OUTPUT_APK" "$APK_PATH"
              echo "✅ APK successfully signed with production Keystore!"
            else
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" "$APK_PATH" "$KEY_ALIAS"
              cp "$APK_PATH" "$OUTPUT_APK"
            fi
            rm -f release.keystore
          else
            echo "ℹ️ No production Keystore secret found, using pre-signed build APK."
            cp "$APK_PATH" "$OUTPUT_APK"
          fi

          echo "RELEASE_APK=$OUTPUT_APK" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMasterPro-APK
          path: ${{ env.RELEASE_APK }}
          retention-days: 14

      - name: 🌐 Create GitHub Release & Publish APK (on tag or main push)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          tag_name: ${{ env.TAG_NAME }}
          name: "VoiceMaster Pro Release ${{ env.TAG_NAME }} (#${{ env.VERSION_CODE }})"
          body: |
            ## 🎉 فويس ماستر برو | VoiceMaster Pro
            
            ### ✨ تحديث جديد متاح عبر الإنترنت (OTA Update)
            - **رقم الإصدار (Version):** `${{ env.TAG_NAME }}`
            - **كود البناء (Build Code):** `${{ env.VERSION_CODE }}`
            - **تاريخ البناء:** `${{ github.event.head_commit.timestamp || '2026' }}`
            - **ملف التثبيت:** `${{ env.RELEASE_APK }}`

            #### 📋 سجل التغييرات في هذا البناء:
            ${{ github.event.head_commit.message || '• تحسينات عامة في أداء الدبلجة ومزامنة الفيديو والهندسة الصوتية.' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
